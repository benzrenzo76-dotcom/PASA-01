services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pasa
      POSTGRES_PASSWORD: pasa_local_only
      POSTGRES_DB: pasa
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pasa_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pasa"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pasa_pg:
